<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="expense-card">

            <h1>Expense Tracker</h1>
            <p class="subtitle">Track and manage your daily expenses</p>

            <div class="form">
                <input type="text" id="expenseName" placeholder="Expense name">

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount (₹)"
                    min="0"
                    step="0.01"
                >

                <button id="addBtn">Add Expense</button>
            </div>

            <div class="total-box">
                <p>Total Expense</p>
                <h2>₹<span id="total">0.00</span></h2>
            </div>

            <h3>Expense List</h3>

            <ul id="expenseList"></ul>

            <p id="emptyMessage">No expenses added yet.</p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
